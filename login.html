<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Arewa Lyrics Hub</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header class="member-header">

    <div class="member-logo">
        AREWA <span>LYRICS HUB</span>
    </div>

    <nav class="member-nav">
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#services">Services</a>
        <a href="register.html">Register</a>
    </nav>

</header>


<main class="auth-page">

    <section class="auth-card">

        <div class="auth-header">

            <span class="welcome-label">
                AREWA LYRICS HUB
            </span>

            <h1>Welcome Back</h1>

            <p>
                Login to access your member dashboard.
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div
                id="loginMessage"
                class="auth-message"
                style="display:none;"
            ></div>


            <button
                type="submit"
                class="admin-btn"
                style="width:100%;"
            >
                Login
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </section>

</main>


<footer class="footer">

    <p>
        © 2026 Arewa Lyrics Hub. All Rights Reserved.
    </p>

</footer>


<script>

document
.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const email =
        document.getElementById("loginEmail")
        .value
        .trim();

    const password =
        document.getElementById("loginPassword")
        .value;


    const message =
        document.getElementById("loginMessage");


    const savedEmail =
        localStorage.getItem("arewaEmail");

    const savedPassword =
        localStorage.getItem("arewaPassword");

    const savedMember =
        localStorage.getItem("arewaMember");


    /*
       Check whether an account
       has been created on this browser.
    */

    if (!savedMember) {

        message.style.display = "block";

        message.innerHTML =
            "No account found. Please create an account first.";

        return;
    }


    /*
       Check login details.
    */

    if (
        email !== savedEmail ||
        password !== savedPassword
    ) {

        message.style.display = "block";

        message.innerHTML =
            "Incorrect email or password.";

        return;
    }


    /*
       Login successful.
    */

    localStorage.setItem(
        "arewaLoggedIn",
        "true"
    );


    message.style.display = "block";

    message.innerHTML =
        "Login successful! Redirecting...";


    setTimeout(function() {

        window.location.href =
            "dashboard.html";

    }, 800);

});

</script>

</body>
</html>
