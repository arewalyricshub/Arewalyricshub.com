<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Arewa Lyrics Hub</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">AREWA <span>LYRICS HUB</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<main class="auth-page">

    <div class="auth-box">

        <p class="tagline">AREWA LYRICS HUB</p>

        <h1>Welcome Back</h1>

        <p>Login to access your account and community dashboard.</p>

        <form>

            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" placeholder="Enter your password" required>

            <button type="submit" class="btn primary">
                Login
            </button>

        </form>

        <p class="auth-link">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

    </div>

</main>

<footer>
    <p>© 2026 Arewa Lyrics Hub. All Rights Reserved.</p>
</footer>

</body>
</html>
