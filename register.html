<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Arewa Lyrics Hub</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">AREWA <span>LYRICS HUB</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main class="auth-page">

    <div class="auth-box">

        <p class="tagline">JOIN OUR COMMUNITY</p>

        <h1>Create Account</h1>

        <p>Register to become part of Arewa Lyrics Hub.</p>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number" required>

            <label>TikTok Username</label>
            <input type="text" placeholder="@username" required>

            <label>Password</label>
            <input type="password" placeholder="Create a password" required>

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm your password" required>

            <button type="submit" class="btn primary">
                Create Account
            </button>

        </form>

        <p class="auth-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</main>

<footer>
    <p>© 2026 Arewa Lyrics Hub. All Rights Reserved.</p>
</footer>

</body>
</html>
